# Flutter add-to-app makes the Android build substantially heavier than Classic-only builds.
# Give the Gradle daemon enough room for AGP/Flutter/CMake configuration and favor stability over parallelism.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Flutter 3.44 add-to-app on AGP 9 currently requires the legacy Kotlin Gradle plugin and legacy Android DSL in the host.
# Add-to-app host projects must opt out of both AGP 9 built-in Kotlin and the new DSL.
android.builtInKotlin=false
android.newDsl=false
